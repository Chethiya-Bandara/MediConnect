services:
  postgres:
    image: postgres:16-alpine
    container_name: mediconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    profiles:
      - local-db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mediconnect-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      UVICORN_RELOAD: "false"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/mediconnect
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_started
        required: false
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: mediconnect-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres-data:
